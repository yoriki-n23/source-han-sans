name: Deploy web fonts to Cloudflare Pages

# Manual fallback. Normal deploys use Cloudflare Pages' Git integration
# (see webfonts/README.md), which needs no API token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: source-han-sans
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r webfonts/requirements.txt

      - run: webfonts/build.sh

      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy"
            exit 0
          fi
          npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch master || true
          npx --yes wrangler@4 pages deploy dist/site --project-name "$PROJECT_NAME" --branch "$GITHUB_REF_NAME"
